<!DOCTYPE html>
<html>
<head>
    <title>Edit Item - Classic Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
    <h1>Edit Cart Item</h1>
</header>

<main class="content">
    <section>
        <form action="cart.html">
            <label>
                Product:
                <select>
                    <option>Cooking Pan</option>
                    <option>Bed Sheets</option>
                </select>
            </label>

            <label>
                Quantity:
                <input type="number" value="1">
            </label>

            <button type="submit">Update</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Classic Home</p>
</footer>

</body>
</html>
